<div class="comment-card" [class.clickable]="readonly" (click)="readonly && goToPost()">
	<!-- Header -->
	<div class="comment-header">
		<div class="author-info" (click)="goToUser(); $event.stopPropagation()">
			<div class="avatar">
				<img [src]="avatarUrl" [alt]="comment.author?.username" *ngIf="comment.author?.avatar" />
				<svg viewBox="0 0 24 24" class="avatar-icon" *ngIf="!comment.author?.avatar">
					<path d="M18 20a6 6 0 0 0-12 0" />
					<circle cx="12" cy="10" r="4" />
					<circle cx="12" cy="12" r="10" />
				</svg>
			</div>
			<div class="author-meta">
				<span class="username">{{ comment.author?.username }}</span>
				<span class="timestamp">{{ comment.createdAt | date:'dd/MM/yyyy HH:mm' }}</span>
			</div>
		</div>
		<div class="comment-actions" *ngIf="isOwner$ | async">
			<button class="action-btn button" (click)="startEdit(); $event.stopPropagation()" title="Edit"
				*ngIf="!isEditing">
				<svg viewBox="0 0 24 24" class="icon">
					<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
					<path
						d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z" />
				</svg>
			</button>
			<button class="action-btn button" (click)="openDeleteDialog(); $event.stopPropagation()" title="Delete">
				<svg viewBox="0 0 24 24" class="icon">
					<path d="M10 11v6" />
					<path d="M14 11v6" />
					<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
					<path d="M3 6h18" />
					<path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
				</svg>
			</button>
		</div>
	</div>

	<!-- Content or Edit form -->
	<div class="comment-body">
		<p class="comment-content" *ngIf="!isEditing">{{ comment.content }}</p>

		<div class="edit-form" *ngIf="isEditing" (click)="$event.stopPropagation()">
			<textarea class="edit-textarea" [(ngModel)]="editContent" rows="3" maxlength="2000"
				placeholder="Edit your comment..." (keydown.escape)="cancelEdit()">
            </textarea>
			<div class="edit-actions">
				<span class="char-count">{{ editContent.length }}/2000</span>
				<button class="btn-cancel" (click)="cancelEdit()">Cancel</button>
				<button class="btn-save" (click)="saveEdit()" [disabled]="!editContent.trim()">Save</button>
			</div>
		</div>
	</div>

	<!-- Footer -->
	<div class="comment-footer">
		<button class="interaction-btn like-btn" [class.liked]="hasUserLiked"
			(click)="toggleLike(); $event.stopPropagation()" title="Like">
			<svg viewBox="0 0 24 24" class="icon">
				<path
					d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" />
				<path d="M7 10v12" />
			</svg>
			<span class="count">{{ comment.likes || 0 }}</span>
		</button>
		<span class="edited-badge" *ngIf="comment.updatedAt && comment.updatedAt !== comment.createdAt">
			( Edited )
		</span>
	</div>
</div>
